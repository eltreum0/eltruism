name: Dev Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: dev-build-release
  cancel-in-progress: true

jobs:
  dev-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Clone project
        uses: actions/checkout@v4
        with:
         fetch-depth: 0

      - name: Check for New Commits
        id: check-commits
        env:
          GITHUB_TOKEN: ${{ secrets.PAGES_PAT }}
        run: |
          CURRENT_SHA="${{ github.sha }}"

          TAG=$(git describe --tags --exact-match $CURRENT_SHA 2>/dev/null) || true
          if [ -n "$TAG" ]; then
            echo "Commit is tagged as $TAG. Skipping Dev Build to let the Release workflow handle it."
            echo "should_run=false" >> $GITHUB_ENV
            exit 0
          fi

          REPO="eltreum0/eltreum0.github.io"
          TAG_NAME="dev-latest"

          RELEASE_BODY=$(gh release view $TAG_NAME --repo $REPO --json body --jq '.body' 2>/dev/null) || true

          LAST_DEPLOYED_SHA=$(echo "$RELEASE_BODY" | grep -oE 'SHA: [a-f0-9]{7}' | awk '{print $2}') || true

          echo "Current SHA: $CURRENT_SHA"
          echo "Last Deployed SHA: $LAST_DEPLOYED_SHA"

          if [ -n "$LAST_DEPLOYED_SHA" ] && [[ "$CURRENT_SHA" == "$LAST_DEPLOYED_SHA"* ]]; then
            echo "Skipping build: No new changes since last deploy."
            echo "should_run=false" >> $GITHUB_ENV
          else
            echo "New changes detected or no prior SHA found. Proceeding with build."
            echo "should_run=true" >> $GITHUB_ENV
          fi

      - name: Auto Changelog
        if: env.should_run == 'true'
        run: sed -i '/manual-changelog:/,$d' .pkgmeta

      - name: Bump version to Dev SHA
        if: env.should_run == 'true'
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          sed -i "s/@project-version@/Dev-${SHORT_SHA}/" ElvUI_EltreumUI/*.toc

      - name: WoW Packager
        if: env.should_run == 'true'
        uses: BigWigsMods/packager@v2
        with:
         args: release.sh -n "ElvUI_EltreumUI"
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Separate Repo Release
        if: env.should_run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.PAGES_PAT }}
        run: |
          ZIP_FILE=$(find .release -name "ElvUI_EltreumUI-*.zip" | head -n 1)
          STATIC_ZIP=".release/ElvUI_EltreumUI-Dev.zip"
          mv "$ZIP_FILE" "$STATIC_ZIP"

          SHORT_SHA="${GITHUB_SHA::7}"

          REPO="eltreum0/eltreum0.github.io"
          TAG_NAME="dev-latest"

          if gh release view $TAG_NAME --repo $REPO > /dev/null 2>&1; then
            gh release upload $TAG_NAME "$STATIC_ZIP" --repo $REPO --clobber
            gh release edit $TAG_NAME --repo $REPO --notes "Automated dev build tracking the main branch. SHA: $SHORT_SHA"
          else
            gh release create $TAG_NAME "$STATIC_ZIP" --repo $REPO -t "Latest Dev Build" --prerelease --notes "Automated dev build tracking the main branch. SHA: $SHORT_SHA"
          fi
